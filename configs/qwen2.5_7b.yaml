# Configuration for Qwen2.5-7B MLPR Fine-tuning

# Model settings
model_name: "Qwen/Qwen2.5-7B-Instruct"
l_star: 14  # Mid-layer index for probe (approx 0.5 * num_layers)

# PEFT LoRA settings
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Dataset settings
# For local synthetic dataset, point to the directory containing train_mem.jsonl and eval_gen.jsonl
# Example: dataset_name: "./dataset"
# For HuggingFace Hub dataset, use the repo name
dataset_name: "./dataset"  # Default: local synthetic dataset
entity_vocab_path: null  # Will auto-load from dataset/vocab.json if null

# Training settings
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4
num_train_epochs: 3
learning_rate: 2.0e-5
warmup_ratio: 0.1
weight_decay: 0.01
output_dir: "./outputs"
evaluation_strategy: "epoch"
save_strategy: "epoch"
logging_steps: 10

# MLPR settings
lambda_0: 0.3
tau_0: 0.9
delta_0: 0.05
# v2 gate metric: which A_mem signal opens the lambda gate.
#   "generation" - free-generation exact match (idea.md v1; diagnosed
#                  unreachable in this regime: plateaus 0-12% vs tau_0=0.9)
#   "likelihood" - teacher-forced greedy answer-token match ("knowing")
#   "max"        - either recall mode can open the gate (v2 recommendation)
gate_metric: "max"

# W&B settings
wandb_entity: "your-entity"
wandb_project: "knowing_using_gap"

# Lifecycle dashboard
lifecycle_enabled: true
hub_model_id: null  # Set to your HF username/repo for pushing checkpoints
